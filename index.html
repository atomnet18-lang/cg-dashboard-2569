<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard ความคืบหน้าแผนงาน CG ประจำปี 2569 | กฟน.</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{
    /* โทนม่วง-ลาเวนเดอร์ + กรมท่า อ้างอิงจากภาพตัวอย่าง (Tasklyn) — พื้นหลังสว่าง */
    --mea-green:#291f4d;--mea-green-d:#1c1638;--mea-green-l:#ece9fb;
    --mea-gold:#ec8463;--mea-gold-d:#d16a49;
    --ink:#241f42;--muted:#6b7280;--line:#e6e4f5;--bg:#eef0fb;--card:#ffffff;
    --card-alt:#f5f3fc;--select-bg:#ffffff;--shadow:rgba(70,60,140,.08);--overlay:rgba(30,20,60,.55);
    --curm-bg:#fdeecb;--warn-bg:#fdece3;--bad-bg:#fbe1df;--empty-ink:#b8b4cf;
    --header-sub:#e7e3fb;--header-soft:#d9d4f5;
    --hover-shadow:rgba(236,132,99,.18);--active-shadow:rgba(236,132,99,.24);
    --ok:#5f4fcf;--warn:#d9773f;--bad:#c23f32;--idle:#6da9e7;
    /* Liquid Glass: พื้นผิวกระจกสำหรับ "ชั้นควบคุม" เท่านั้น (header/ปุ่ม/สวิตช์) เนื้อหาหลักยังทึบเสมอ */
    --glass-tint:255,255,255;--glass-a1:.68;--glass-a2:.42;--glass-edge:rgba(255,255,255,.6);--glass-hl:rgba(255,255,255,.75);
    --track-off:rgba(36,31,66,.14);
    --r-pill:999px;--r-xl:26px;--r-lg:20px;--r-md:14px;--r-sm:10px;
    --ambient-1:#cfe0f7;--ambient-2:#d9d3f7;--ambient-3:#f7d9c9;
    /* ข้อความ "แบรนด์" ที่ใช้วางบนพื้นหลากหลาย ต้องแยกจากสีพื้นเพราะโทนต่างกันคนละทิศระหว่างโหมด */
    --heading:#1c1638;--label-ink:#1c1638;--accent-text:#a84a24;--chip-ink:#fff;
  }
  /* ===== Dark mode: อ้างอิงโทนสีจากภาพตัวอย่าง (ดำ/น้ำตาลเข้ม + ส้ม) ===== */
  html[data-theme="dark"]{
    /* โทนม่วง-ลาเวนเดอร์ + กรมท่า อ้างอิงจากภาพตัวอย่าง (Tasklyn) — พื้นหลังมืด */
    --mea-green:#2a2251;--mea-green-d:#120c28;--mea-green-l:#372c68;
    --mea-gold:#ec8463;--mea-gold-d:#d16a49;
    --ink:#ece9f9;--muted:#a49bc9;--line:#342a5c;--bg:#110c26;--card:#1a1436;
    --card-alt:#211a45;--select-bg:#211a45;--shadow:rgba(0,0,0,.35);--overlay:rgba(6,4,16,.7);
    --curm-bg:#3a2f14;--warn-bg:#3a2415;--bad-bg:#3a1a17;--empty-ink:#675f8c;
    --header-sub:#ded7f7;--header-soft:#cfc6ef;
    --hover-shadow:rgba(240,145,110,.22);--active-shadow:rgba(240,145,110,.30);
    --ok:#b39cf0;--warn:#f0a15f;--bad:#f2685c;--idle:#7fb8f5;
    /* ข้อความแบรนด์: โหมดมืดใช้ส้มสว่างเป็นหัวข้อเน้น และม่วงอ่อนสำหรับตัวหนังสือรอง */
    --heading:#f0a15f;--label-ink:#ded7f7;--accent-text:#f0a15f;--chip-ink:#14102a;
    --glass-tint:26,20,54;--glass-a1:.60;--glass-a2:.34;--glass-edge:rgba(255,255,255,.14);--glass-hl:rgba(255,255,255,.10);
    --track-off:rgba(255,255,255,.16);
    --ambient-1:#3a2f6e;--ambient-2:#2a3f66;--ambient-3:#241a3d;
  }
  html[data-theme="dark"] body{background:var(--bg)}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Segoe UI","Sarabun",Tahoma,sans-serif;color:var(--ink);line-height:1.45;min-height:100vh;
    background:
      radial-gradient(900px 500px at 8% -10%, var(--ambient-1), transparent 60%),
      radial-gradient(800px 480px at 100% 0%, var(--ambient-2), transparent 55%),
      radial-gradient(1000px 600px at 50% 100%, var(--ambient-3), transparent 60%),
      var(--bg);
    background-attachment:fixed}
  header{
    position:sticky;top:14px;z-index:50;max-width:1280px;margin:14px auto 22px;padding:18px 26px;
    border-radius:var(--r-xl);color:var(--ink);
    background:linear-gradient(165deg,rgba(var(--glass-tint),var(--glass-a1)),rgba(var(--glass-tint),var(--glass-a2)));
    -webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);
    border:1px solid var(--glass-edge);
    box-shadow:inset 0 1px 0 var(--glass-hl), inset 0 0 0 1px rgba(255,255,255,.03), 0 10px 34px rgba(20,12,4,.14)}
  header .top{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .logo{width:56px;height:56px;border-radius:50%;object-fit:cover;background:#fff;display:block;flex:none;border:2px solid var(--mea-gold);box-shadow:0 2px 8px rgba(0,0,0,.12)}
  header h1{font-size:20px;font-weight:700;color:var(--ink)}
  header .sub{color:var(--muted);font-size:13px;margin-top:2px}
  .asof{margin-left:auto;text-align:right;font-size:12px;color:var(--muted)}
  .asof select{margin-top:4px;padding:6px 14px;border-radius:var(--r-pill);border:1px solid var(--glass-edge);font-size:13px;
    background:rgba(var(--glass-tint),.55);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:var(--ink)}
  .wrap{max-width:1280px;margin:0 auto;padding:22px}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
  .kpi{background:var(--card);border-radius:var(--r-lg);padding:16px 16px 14px;border:1px solid var(--line);box-shadow:0 1px 4px var(--shadow);cursor:pointer;transition:.15s;position:relative;overflow:hidden}
  .kpi:hover{transform:translateY(-2px);box-shadow:0 6px 16px var(--hover-shadow)}
  .kpi.active{border-color:var(--mea-green);box-shadow:0 6px 18px var(--active-shadow)}
  .kpi .bar{position:absolute;top:0;left:0;width:5px;height:100%}
  .kpi .name{font-size:13px;color:var(--muted);font-weight:600;min-height:34px}
  .kpi .num{display:flex;align-items:baseline;gap:6px;margin-top:8px}
  .kpi .actual{font-size:30px;font-weight:800}
  .kpi .target{font-size:13px;color:var(--muted)}
  .kpi .track{height:8px;border-radius:6px;background:var(--card-alt);margin-top:10px;overflow:hidden;position:relative}
  .kpi .fill{height:100%;border-radius:6px}
  .kpi .tmark{position:absolute;top:-2px;width:2px;height:12px;background:var(--mea-gold-d)}
  .kpi .meta{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:8px}
  .chip{font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px;color:var(--chip-ink)}
  .grid2{display:grid;grid-template-columns:1.35fr 1fr;gap:16px;margin-bottom:18px}
  .panel{background:var(--card);border-radius:var(--r-lg);border:1px solid var(--line);box-shadow:0 1px 4px var(--shadow);padding:18px}
  .panel h2{font-size:15px;color:var(--heading);margin-bottom:4px;display:flex;align-items:center;gap:8px}
  .scramble{display:inline-block;white-space:nowrap}
  .scramble-ch{display:inline-block;text-align:center;font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
  @media (prefers-reduced-motion: reduce){.scramble-ch{transition:none}}
  .panel h2 .dot{width:9px;height:9px;border-radius:3px;background:var(--mea-gold)}
  .panel .desc{font-size:12px;color:var(--muted);margin-bottom:12px}
  .chartbox{position:relative;height:300px}
  .chartbox.sm{height:260px}
  .tablewrap{overflow:auto;max-height:560px;border-radius:var(--r-md);border:1px solid var(--line)}
  table{width:100%;border-collapse:collapse;font-size:13px;min-width:640px}
  thead th{position:sticky;top:0;background:var(--mea-green);color:#fff;font-weight:600;padding:10px 12px;text-align:left;z-index:2;font-size:12.5px}
  tbody td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
  tbody tr:nth-child(even){background:var(--card-alt)}
  tbody tr:hover{background:var(--mea-green-l)}
  td.center{text-align:center;white-space:nowrap}
  .grp{background:var(--mea-green-l)!important;font-weight:700;color:var(--label-ink)}
  .mini{height:7px;border-radius:5px;background:var(--card-alt);overflow:hidden;min-width:90px}
  .mini i{display:block;height:100%}
  .stat{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;color:var(--chip-ink)}
  .w{font-size:11px;color:var(--muted)}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:12px}
  .legend span{display:inline-flex;align-items:center;gap:5px}
  .legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
  .note{font-size:11.5px;color:var(--muted);margin-top:14px;padding:10px 12px;background:var(--mea-green-l);border-radius:8px;border-left:3px solid var(--mea-gold)}
  .actrow{cursor:pointer}
  .actrow .more{font-size:11px;color:var(--accent-text);font-weight:600;white-space:nowrap;opacity:.75}
  .actrow:hover .more{opacity:1;text-decoration:underline}
  .modal{display:none;position:fixed;inset:0;background:var(--overlay);z-index:100;align-items:center;justify-content:center;padding:20px}
  .modal.show{display:flex}
  .mbox{background:var(--card);border-radius:var(--r-xl);max-width:760px;width:100%;max-height:86vh;overflow:auto;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.3)}
  .mclose{position:absolute;top:14px;right:14px;border:none;background:var(--mea-green-l);color:var(--label-ink);width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:14px;font-weight:700;z-index:2}
  .mclose:hover{background:var(--mea-green);color:#fff}
  .mhead{background:linear-gradient(120deg,var(--mea-green-d),var(--mea-green));color:#fff;padding:22px 24px 18px;border-radius:var(--r-xl) var(--r-xl) 0 0}
  .mtag{font-size:12px;font-weight:700;color:var(--mea-gold);letter-spacing:.5px}
  .mhead h3{font-size:17px;margin:6px 0 8px;line-height:1.4}
  .msub{font-size:12.5px;color:var(--header-sub)}
  .mtblwrap{padding:18px 24px}
  .mtbl{width:100%;border-collapse:collapse;font-size:13px}
  .mtbl thead th{background:var(--mea-green-l);color:var(--label-ink);padding:9px 10px;text-align:left;font-size:12px;border-bottom:2px solid var(--mea-green)}
  .mtbl td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  .mtbl .mcell{font-weight:700;color:var(--label-ink);white-space:nowrap}
  .mtbl .ncell{color:var(--ink);line-height:1.5}
  .mtbl .ncell .empty{color:var(--empty-ink);font-style:italic;font-size:12px}
  .mtbl .curm{background:var(--curm-bg)}
  .mtbl .curm .mcell{color:var(--accent-text)}
  .mtbl .future{opacity:.45}
  .dotst{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:middle}
  .mfoot{font-size:11.5px;color:var(--muted);padding:4px 24px 22px;line-height:1.6}
  .reportbody{white-space:pre-wrap;font-size:13px;color:var(--ink);line-height:1.65;background:var(--card-alt);border:1px solid var(--line);border-radius:8px;padding:12px 14px;min-height:130px}
  .reportbody .empty{color:var(--empty-ink);font-style:italic}
  .latelist{list-style:none;display:flex;flex-direction:column;gap:8px;margin:0;padding:0}
  .latelist li{padding:9px 12px;border-radius:8px;border-left:4px solid;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
  .latelist li.lt-warn{border-color:var(--warn);background:var(--warn-bg)}
  .latelist li.lt-bad{border-color:var(--bad);background:var(--bad-bg)}
  .lt-name{font-weight:700;font-size:13px;color:var(--ink)}
  .lt-sub{color:var(--muted);font-weight:400;font-size:11px}
  .lt-meta{font-size:12px;color:var(--muted);white-space:nowrap}
  .lt-meta b{color:var(--bad)}
  .lateempty{padding:14px;text-align:center;color:var(--ok);font-size:13px;background:var(--mea-green-l);border-radius:8px;font-weight:600}
  .theme-switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
  .ts-txt{font-size:12px;color:var(--muted)}
  .theme-switch input[type="checkbox"]{position:absolute;width:36px;height:20px;opacity:0;margin:0;cursor:pointer}
  .ts-track{width:36px;height:20px;border-radius:var(--r-pill);background:var(--track-off);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid var(--glass-edge);position:relative;flex:none;transition:background .2s ease}
  .ts-thumb{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .2s ease;box-shadow:0 1px 3px rgba(0,0,0,.35)}
  .theme-switch input:checked ~ .ts-track{background:var(--mea-gold)}
  .theme-switch input:checked ~ .ts-track .ts-thumb{left:18px}
  .theme-switch input:focus-visible ~ .ts-track{outline:2px solid var(--mea-gold);outline-offset:3px}
  .loading{text-align:center;padding:60px;color:var(--muted)}
  .err{text-align:center;padding:40px;color:var(--bad);font-size:14px}
  footer{text-align:center;color:var(--muted);font-size:11.5px;padding:18px}
  @media(max-width:980px){.grid2{grid-template-columns:1fr}header{margin:10px;border-radius:var(--r-lg)}}

  /* ---- แถบตัวเลือกแผน (ย่อขนาด) ฝังอยู่ในส่วนหัว ---- */
  .kpis-compact{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0 0}
  .kpis-compact .kpi{padding:9px 11px 8px;border-radius:var(--r-md)}
  .kpis-compact .kpi .name{font-size:11px;min-height:auto;line-height:1.3;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
  .kpis-compact .kpi .num{margin-top:4px;gap:5px}
  .kpis-compact .kpi .actual{font-size:18px}
  .kpis-compact .kpi .target{font-size:10.5px}
  .kpis-compact .kpi .chip{font-size:9.5px;padding:1px 7px}
  .kpis-compact .kpi .track{height:5px;margin-top:6px}
  .kpis-compact .kpi .meta{display:none}
  @media(max-width:700px){.kpis-compact{grid-template-columns:repeat(2,1fr)}}

  /* ---- โฟกัสที่มองเห็นได้ชัด บนทุกองค์ประกอบที่กดได้ (คีย์บอร์ด/สกรีนรีดเดอร์) ---- */
  .kpi:focus-visible,.actrow:focus-visible{outline:2px solid var(--mea-gold);outline-offset:3px}
  .asof select:focus-visible{outline:2px solid var(--mea-gold);outline-offset:2px}
  .mclose:focus-visible{outline:2px solid var(--mea-gold);outline-offset:3px}

  /* ---- เคารพ Reduce Transparency: ชั้นกระจกเปลี่ยนเป็นพื้นทึบสนิท ---- */
  @media (prefers-reduced-transparency: reduce){
    header,.asof select,.ts-track{
      -webkit-backdrop-filter:none!important;backdrop-filter:none!important;
      background:var(--card)!important;border-color:var(--line)!important;
    }
    body{background:var(--bg)}
  }
  /* ---- เคารพ Reduce Motion: ปิดการเคลื่อนไหว/เอฟเฟกต์ลอย ---- */
  @media (prefers-reduced-motion: reduce){
    .kpi{transition:none}
    .kpi:hover{transform:none}
    .ts-track,.ts-thumb{transition:none}
  }
</style>
</head>
<body>
<header>
  <div class="top">
    <img class="logo" src="logo.png" alt="ตราสัญลักษณ์การไฟฟ้านครหลวง">
    <div>
      <h1>แผนงานการกำกับดูแลกิจการที่ดี (CG) ประจำปี 2569</h1>
      <div class="sub">การไฟฟ้านครหลวง · ฝ่ายบริหารความเสี่ยงองค์กร (ฝบส.) · รองผู้ว่าการยุทธศาสตร์องค์กรและความยั่งยืน</div>
    </div>
    <div class="asof">
      <label class="theme-switch">
        <span class="ts-txt">โหมดมืด</span>
        <input type="checkbox" role="switch" id="themeSwitch" aria-label="สลับโหมดมืด">
        <span class="ts-track"><span class="ts-thumb"></span></span>
      </label>
      <div style="margin-top:8px">ข้อมูล ณ เดือน<br><select id="monthSel"></select></div>
      <div id="updated" style="margin-top:6px;font-size:11px"></div>
    </div>
  </div>
  <div class="kpis kpis-compact" id="kpis"></div>
</header>

<div class="wrap" id="app">
  <div class="loading">⏳ กำลังโหลดข้อมูลจาก data.json ...</div>
</div>

<footer>จัดทำโดยงานด้าน CG · ฝ่ายบริหารความเสี่ยงองค์กร (ฝบส.) การไฟฟ้านครหลวง — ข้อมูลปรับปรุงผ่าน data.json</footer>

<script>
const MONTHS=["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
// สีสถานะ ok/warn/bad/idle — ปรับความสว่างต่างกันระหว่างโหมดสว่าง/มืด เพื่อให้อ่านง่ายบนพื้นเข้ม
const C_LIGHT={ok:'#5f4fcf',warn:'#d9773f',bad:'#c23f32',idle:'#6da9e7'};
const C_DARK ={ok:'#b39cf0',warn:'#f0a15f',bad:'#f2685c',idle:'#7fb8f5'};
const C={...C_LIGHT};
// สีตัวอักษรบนป้ายสถานะ (chip/stat) ต้อง "ปรับตามพื้นหลัง" ต่อสถานะ — คำนวณคอนทราสต์ยืนยันแล้วทุกคู่ (WCAG AA)
const CINK_LIGHT={ok:'#fff',warn:'#1c1638',bad:'#fff',idle:'#1c1638'};
const CINK_DARK ={ok:'#14102a',warn:'#14102a',bad:'#14102a',idle:'#14102a'};
const CINK={...CINK_LIGHT};
function isDark(){return document.documentElement.getAttribute('data-theme')==='dark';}
function applyStatusColors(){Object.assign(C, isDark()?C_DARK:C_LIGHT);Object.assign(CINK, isDark()?CINK_DARK:CINK_LIGHT);}
// สีเส้น/พื้นที่กราฟ (เป้าหมาย=ทอง/ส้ม, ผลจริง=เขียว) ปรับตามธีม
function chartColors(){
  return isDark()
    ?{gold:'#ec8463',goldFill:'rgba(236,132,99,.20)',green:C_DARK.ok,greenFill:'rgba(179,156,240,.18)'}
    :{gold:'#ec8463',goldFill:'rgba(236,132,99,.14)',green:C_LIGHT.ok,greenFill:'rgba(95,79,207,.12)'};
}
// ปลั๊กอินจุดกระพริบ (pulse) ที่จุดเดือนปัจจุบัน บนกราฟเส้นเป้าหมาย/ผลจริง
const pulsePlugin={id:'pulse',afterDatasetsDraw(chart){
  if(chart.canvas.id!=='trend'||typeof curMonth!=='number')return;
  const cc=chartColors();
  const reduced=prefersReducedMotion();
  const ctx=chart.ctx,phase=reduced?0.25:(Date.now()%1300)/1300,cols=[cc.gold,cc.green];
  [0,1].forEach(di=>{
    const meta=chart.getDatasetMeta(di),pt=meta&&meta.data&&meta.data[curMonth];
    if(!pt||isNaN(pt.x)||isNaN(pt.y))return;
    ctx.save();
    ctx.beginPath();ctx.arc(pt.x,pt.y,5+phase*13,0,Math.PI*2);
    ctx.strokeStyle=cols[di];ctx.globalAlpha=1-phase;ctx.lineWidth=2.5;ctx.stroke();
    ctx.globalAlpha=1;ctx.beginPath();ctx.arc(pt.x,pt.y,4.5,0,Math.PI*2);
    ctx.fillStyle=cols[di];ctx.fill();
    ctx.beginPath();ctx.arc(pt.x,pt.y,4.5,0,Math.PI*2);ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.stroke();
    ctx.restore();
  });
}};
let DATA=null,curMonth=5,curPlan=null,trendChart,compChart;

function planCumActual(p,mi){
  const acts=p.acts.filter(a=>a.id);
  const tw=acts.reduce((s,a)=>s+a.w,0);
  let v=0;acts.forEach(a=>{v+=a.w*actualAt(a,mi)/100;});
  return tw?+(v/tw*100).toFixed(1):0;
}
function statusOf(t,a){if(!t)return'idle';if(a>=t)return'ok';if(t-a<=15)return'warn';return'bad';}
function prefersReducedMotion(){return window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;}

/* Text Scramble (decode effect): แต่ละตัวอักษรปั่นสุ่มแล้ว "ล็อก" เป็นตัวจริงจากซ้ายไปขวา
   ความกว้างแต่ละช่องล็อกด้วยการวัดฟอนต์จริงผ่าน canvas (เทียบเท่า tabular glyphs) ป้องกันข้อความสั่น/เนื้อหาข้างเคียงเลื่อน
   สลับข้อความจริงผ่าน aria-label ทันที ส่วนตัวอักษรที่กำลังปั่นทำเครื่องหมาย aria-hidden ไว้
   หาก prefers-reduced-motion เปิดอยู่ จะเรนเดอร์ข้อความจริงทันทีโดยไม่มีอนิเมชัน */
function scrambleText(el, finalText, opts){
  opts = opts || {};
  const glyphs = opts.glyphs || 'กขคงจฉชซญฎฏฐฑฒณดตถทธนบปผฝพฟภมยรลวศษสหฬอฮะาิีึืุูเแโใไ่้๊๋ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
  const stepMs = opts.stepMs || 34;
  const settleMs = opts.settleMs || 360;
  el.setAttribute('aria-label', finalText);
  const chars = Array.from(finalText);

  if(prefersReducedMotion()){
    el.innerHTML='';
    const still=document.createElement('span');
    still.setAttribute('aria-hidden','true');
    still.textContent=finalText;
    el.appendChild(still);
    return;
  }

  const cs=getComputedStyle(el);
  const font=cs.fontStyle+' '+cs.fontVariant+' '+cs.fontWeight+' '+cs.fontSize+'/'+cs.lineHeight+' '+cs.fontFamily;
  const canvas=scrambleText._canvas||(scrambleText._canvas=document.createElement('canvas'));
  let ctx=null;
  try{ctx=canvas.getContext('2d');if(ctx)ctx.font=font;}catch(e){}

  el.innerHTML='';
  const wrap=document.createElement('span');
  wrap.setAttribute('aria-hidden','true');
  el.appendChild(wrap);

  const spans=chars.map(ch=>{
    const sp=document.createElement('span');
    sp.className='scramble-ch';
    if(ctx)sp.style.width=Math.ceil(ctx.measureText(ch).width)+'px';
    sp.textContent=ch===' '?'\u00A0':ch;
    wrap.appendChild(sp);
    return sp;
  });

  const start=performance.now();
  (function frame(now){
    let running=false;
    chars.forEach((ch,i)=>{
      if(ch===' ')return;
      const lockAt=start+i*stepMs+settleMs;
      if(now<lockAt){
        spans[i].textContent=glyphs[(Math.random()*glyphs.length)|0];
        running=true;
      }else if(spans[i].textContent!==ch){
        spans[i].textContent=ch;
      }
    });
    if(running)requestAnimationFrame(frame);
  })(start);
}
// ทำให้องค์ประกอบกดด้วยเมาส์/คีย์บอร์ดได้เหมือนกัน (Enter/Space) เพื่อให้ focus-visible มีความหมายจริง
function makeActivatable(el,fn){
  el.tabIndex=0;el.setAttribute('role','button');
  el.onclick=fn;
  el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();fn();}};
}
// ถ้ากิจกรรมเคยถึง 100% (งานเสร็จ) ในเดือนก่อนหน้า ให้ถือว่าเสร็จต่อเนื่อง
function doneBefore(a,i){if(!a.a)return false;for(let j=0;j<i;j++){if((+a.a[j]||0)>=100)return true;}return false;}
// ผลจริงที่ใช้แสดงผล: เดือนที่ว่าง(0) หลังกิจกรรมเสร็จแล้ว = 100%
function actualAt(a,i){const v=(a.a&&+a.a[i])||0;return (v===0&&doneBefore(a,i))?100:v;}
// แผน 9 หมวด: รวมกิจกรรมย่อยเป็น "หมวด" แล้วคำนวณเป้าหมาย/ผลจริงแบบถ่วงน้ำหนักรายเดือน
function buildCategories(p){
  const cats=[];let cur=null;
  p.acts.forEach(a=>{
    if(a.grp){const gs=String(a.grp).trim();const mm=gs.match(/^(\d+)\s*[·:.\-]?\s*(.*)$/);cur={num:mm?mm[1]:'',name:mm?mm[2]:gs,acts:[]};cats.push(cur);}
    else if(a.id&&cur){cur.acts.push(a);}
  });
  return cats;
}
function catCum(cat,which,mi){
  const tw=cat.acts.reduce((s,a)=>s+a.w,0);
  let v=0;cat.acts.forEach(a=>{const val=which==='t'?(a.t[mi]||0):actualAt(a,mi);v+=a.w*val/100;});
  return tw?+(v/tw*100).toFixed(1):0;
}

function openModal(planKey,aid){

      <div class="msub">ผู้รับผิดชอบ: <b>${a.unit}</b> · ค่าถ่วงน้ำหนัก: <b>${a.w}</b></div>

function renderLate(){

  const list=[];
  p.acts.forEach(a=>{
    if(!a.id)return;
    const t=a.t[curMonth],av=actualAt(a,curMonth),st=statusOf(t,av);
    if(st==='warn'||st==='bad')list.push({a,t,av,gap:+(t-av).toFixed(1),st,cat:catOf(a)});
  });
  list.sort((x,y)=>y.gap-x.gap);

  if(!list.length){el.innerHTML=`<div class="lateempty">✓ ไม่มีกิจกรรมที่ล่าช้ากว่าแผน ณ เดือน ${MONTHS[curMonth]} 2569</div>`;return;}
  let h='<ul class="latelist">';
  for(const it of list){
    const ctx=it.cat?`หมวด ${it.cat.num}`:(it.a.aid||'');
    h+=`<li class="lt-${it.st}"><span class="lt-name">${it.a.name} <span class="lt-sub">(${ctx})</span></span><span class="lt-meta">เป้า ${it.t}% · ทำได้ ${it.av}% · <b>ต่ำกว่าเป้า ${it.gap} จุด</b></span></li>`;

  el.innerHTML=h+'</ul>';
}

  b.innerHTML=txt?txt.replace(/</g,'&lt;').replace(/\n/g,'<br>'):'<span class="empty">— ยังไม่มีสรุปรายงานสำหรับเดือนนี้ —</span>';
}
function renderAll(){renderKpis();renderTrend();renderCompare();renderLate();renderReport();renderTable();}

/* ---- Dark mode: สลับธีมด้วยสวิตช์ในหัว Dashboard ---- */
function applyChartDefaults(){
  const dark=isDark();
  Chart.defaults.color=dark?'#c9b8a4':'#5e6f68';
  Chart.defaults.borderColor=dark?'#3a2e24':'#e3eae6';
}
function setTheme(theme){
  document.documentElement.setAttribute('data-theme',theme);
  try{localStorage.setItem('cg-theme',theme);}catch(e){}
  const sw=document.getElementById('themeSwitch');
  if(sw)sw.checked=(theme==='dark');
  applyStatusColors();
  applyChartDefaults();
  if(DATA&&curPlan)renderAll();
}
function initTheme(){
  let saved=null; try{saved=localStorage.getItem('cg-theme');}catch(e){}
  const prefersDark=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches;
  setTheme(saved||(prefersDark?'dark':'light'));
  const sw=document.getElementById('themeSwitch');
  if(sw)sw.addEventListener('change',e=>setTheme(e.target.checked?'dark':'light'));
}
initTheme();

document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});

function boot(){
  document.getElementById('app').innerHTML=APP_HTML;
  const ms=document.getElementById('monthSel');
  MONTHS.forEach((m,i)=>{const o=document.createElement('option');o.value=i;o.textContent=m+" 2569";ms.appendChild(o);});
  ms.value=curMonth;ms.onchange=e=>{curMonth=+e.target.value;renderAll();};
  if(DATA.updated)document.getElementById('updated').textContent="อัปเดต: "+DATA.updated;
  curPlan=Object.keys(DATA.plans)[0];
  renderAll();
  const trendHead=document.getElementById('trendHeadTxt');
  if(trendHead)scrambleText(trendHead, trendHead.getAttribute('aria-label'));
}

fetch('data.json',{cache:'no-store'})
  .then(r=>{if(!r.ok)throw new Error(r.status);return r.json();})
  .then(d=>{DATA=d;boot();})
  .catch(e=>{document.getElementById('app').innerHTML=
    `<div class="err">ไม่สามารถโหลด data.json ได้ (${e.message})<br><br>
     หากเปิดไฟล์ตรงๆ จากเครื่อง เบราว์เซอร์จะบล็อกการอ่านไฟล์ (CORS)<br>
     ให้รันผ่านเซิร์ฟเวอร์: <code>python -m http.server</code> แล้วเปิด http://localhost:8000<br>
     หรือ deploy ขึ้น GitHub Pages ซึ่งจะทำงานได้ปกติ</div>`;});
</script>
<div id="modal" class="modal" onclick="if(event.target===this)closeModal()">
  <div class="mbox">
    <button class="mclose" onclick="closeModal()">✕</button>
    <div id="modalBody"></div>
  </div>
</div>
